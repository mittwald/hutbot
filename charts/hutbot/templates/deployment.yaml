{{- $imageTag := required "image.tag must be set to a specific image tag (e.g. v1.0.9); floating tags like 'latest' and 'main' are not allowed" .Values.image.tag -}}
{{- if has (lower (toString $imageTag)) (list "latest" "main") -}}
{{- fail "image.tag must be set to a specific image tag (e.g. v1.0.9); floating tags like 'latest' and 'main' are not allowed" -}}
{{- end }}
{{- if and (include "hutbot.mountBuiltinCalendars" .) .Values.persistence.enabled }}
{{- if eq (trimSuffix "/" (clean .Values.builtinCalendars.mountPath)) (trimSuffix "/" (clean .Values.persistence.mountPath)) }}
{{- fail "builtinCalendars.mountPath must differ from persistence.mountPath; mounting the Secret there would hide the state volume" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: hutbot is a singleton on a ReadWriteOnce volume, so a rolling
  # restart would briefly run two bots — two writers on bot.json, two schedulers and two
  # OpsGenie heartbeats. The trade-off is a few seconds of gap per restart, which is why
  # sync-secret.sh and the deploy scripts check the Secret before they touch anything.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
{{ toYaml .Values.hostAliases | indent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            # Synced from Vault out of band; the chart never renders it.
            - secretRef:
                name: {{ include "hutbot.secretName" . }}
          {{- if .Values.ui.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          {{- end }}
          env:
            # What `help` / `news` report as the running version.
            - name: HUTBOT_VERSION
              value: {{ $imageTag | quote }}
            {{- if .Values.time.timezone }}
            - name: TZ
              value: {{ .Values.time.timezone | quote }}
            {{- end }}
            {{- if .Values.time.locale }}
            - name: HUTBOT_DEFAULT_DATETIME_LOCALE
              value: {{ .Values.time.locale | quote }}
            {{- end }}
            {{- if .Values.slack.slashCommand }}
            - name: HUTBOT_SLASH_COMMAND
              value: {{ .Values.slack.slashCommand | quote }}
            {{- end }}
            {{- if .Values.slack.botName }}
            - name: HUTBOT_BOT_NAME
              value: {{ .Values.slack.botName | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: HUTBOT_CONFIG_FILE
              value: {{ printf "%s/%s" .Values.persistence.mountPath "bot.json" }}
            - name: HUTBOT_EMPLOYEE_CACHE_FILE
              value: {{ printf "%s/%s" .Values.persistence.mountPath "employees.json" }}
            - name: HUTBOT_SCHEDULED_REPLIES_CACHE_FILE
              value: {{ printf "%s/%s" .Values.persistence.mountPath "scheduled_replies.json" }}
            - name: HUTBOT_BUTTON_CACHE_FILE
              value: {{ printf "%s/%s" .Values.persistence.mountPath "button_states.json" }}
            {{- end }}
            {{- if include "hutbot.mountBuiltinCalendars" . }}
            # The built-in calendar list is a multi-line JSON document whose URLs carry feed
            # tokens. Read from a file rather than the environment: no per-variable exec
            # limit to run into, the kubelet refreshes a mounted Secret in place, and local
            # runs can point at a file too — `.env` cannot hold a multi-line value.
            - name: HUTBOT_BUILTIN_CALENDARS_FILE
              value: {{ include "hutbot.builtinCalendarsFile" . | quote }}
            {{- end }}
            {{- with .Values.calendar.allowedHosts }}
            # Feed hosts exempt from the internal-address refusal. Not secret, and set by
            # whoever runs the instance rather than per channel, so it belongs in the chart
            # rather than in the Secret.
            - name: HUTBOT_CALENDAR_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.calendar.ttlSeconds }}
            - name: HUTBOT_CALENDAR_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.calendar.lookbackDays }}
            # How far back the `offset=prev` search goes; the ICS library has no `before()`.
            - name: HUTBOT_CALENDAR_LOOKBACK_DAYS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ui.enabled }}
            - name: HUTBOT_UI_ENABLED
              value: "true"
            - name: HUTBOT_UI_PORT
              value: {{ .Values.ui.port | quote }}
            - name: HUTBOT_UI_HOST
              value: {{ .Values.ui.host | quote }}
            - name: HUTBOT_UI_USER_HEADER
              value: {{ .Values.ui.userHeader | quote }}
            {{- end }}
          {{- if or .Values.persistence.enabled (include "hutbot.mountBuiltinCalendars" .) }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: config
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if include "hutbot.mountBuiltinCalendars" . }}
            - name: builtin-calendars
              mountPath: {{ trimSuffix "/" (clean .Values.builtinCalendars.mountPath) | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if .Values.ui.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{ toYaml .Values.resources | indent 12 }}
          {{- end }}
      {{- if or .Values.persistence.enabled (include "hutbot.mountBuiltinCalendars" .) }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc
        {{- end }}
        {{- if include "hutbot.mountBuiltinCalendars" . }}
        # One key projected as one file. `optional: true` on purpose: an instance with no
        # built-in calendars must still start, and the bot then falls back to the envFrom
        # copy of the variable, or to having none.
        - name: builtin-calendars
          secret:
            secretName: {{ include "hutbot.secretName" . }}
            optional: true
            defaultMode: 0440
            items:
              - key: {{ .Values.builtinCalendars.secretKey | quote }}
                path: {{ .Values.builtinCalendars.fileName | quote }}
        {{- end }}
      {{- end }}
