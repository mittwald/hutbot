# Default values for hutbot chart

replicaCount: 1

image:
  repository: hutbot
  # Must be set to a specific, immutable tag (e.g. v1.0.9). Rendering fails if empty.
  # Floating tags (latest, main) are intentionally not used for deployments.
  tag: ""
  pullPolicy: IfNotPresent

# Kubernetes Secret holding every credential, managed out of band by scripts/sync-secret.sh
# (sourced from Vault) and only read here. It must carry SLACK_APP_TOKEN and SLACK_BOT_TOKEN;
# OPSGENIE_*, EMPLOYEE_LIST_* and HUTBOT_BUILTIN_CALENDARS are optional additions. Every key
# becomes an environment variable. Rendering fails while this is empty, on purpose: there is
# no fallback that would template the credentials back into the release.
existingSecret: ""

# Instance-wide "built-in" ICS calendar feeds every channel can point at by name, as a JSON
# array of {"name","title","url"} objects. Their URLs carry tokens, so the list lives in the
# Secret above and is mounted as a file rather than only injected as a variable.
builtinCalendars:
  mountFile: true
  mountPath: /etc/hutbot
  fileName: builtin-calendars.json
  secretKey: HUTBOT_BUILTIN_CALENDARS

slack:
  # Slash command this instance listens on. Must match the command configured in
  # the Slack app backing these tokens. Empty = the bot's default (/hutbot).
  slashCommand: ""
  # Name the bot calls itself in user-facing text, e.g. "Hutbot (DEV)".
  # Empty = the bot's default ("Hutbot").
  botName: ""

# Timezone and date/time locale the whole instance runs in.
time:
  # IANA zone name forced into the container as TZ, e.g. "Europe/Berlin". This is
  # the server local timezone: configs that set no timezone of their own format
  # date/times in it and have their work days/work hours counted in it. Empty =
  # the image default, UTC.
  timezone: ""
  # Fallback date/time locale for configs that set none, e.g. "de_DE". Only `de`
  # has translations; every other locale renders English day/month names.
  locale: ""

# Egress allow-list rendered into the NetworkPolicy. `rules` is a list of
# {port, cidrs: []} entries (helmfile builds it from NETWORKPOLICY_RULES); with none, the
# single `port`/`cidr` pair below is used instead.
networkPolicy:
  rules: []
  port: 443
  cidr: "0.0.0.0/0"

resources: {}

# Web UI served by the bot over HTTP
ui:
  enabled: false
  port: 8080
  host: "0.0.0.0"
  # Trusted reverse-proxy header carrying the authenticated user's email.
  userHeader: "X-Forwarded-Email"
  # NetworkPolicy ingress sources allowed to reach the UI port. Each entry is a
  # NetworkPolicy peer (e.g. namespaceSelector / podSelector / ipBlock) and is
  # rendered verbatim into the ingress rule's `from:`. STRONGLY recommended: the UI
  # trusts a proxy-set email header, so any pod that can reach the port can spoof it.
  # Empty list = allow all sources (back-compat, insecure). Example:
  #   allowedIngress:
  #     - namespaceSelector:
  #         matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
  allowedIngress: []
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []   # list of {secretName, hosts: []}

# Persistence configuration for storing the bot config file on a PersistentVolumeClaim
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 100Mi
  storageClass: ""
  mountPath: "/data"
